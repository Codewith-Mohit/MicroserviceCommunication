apiVersion: apps/v1
kind: Deployment
metadata:
  name: besvc3-deployment
  namespace: microservices-communication
  labels:
    app: besvc3
spec:
  replicas: 2
  selector:
    matchLabels:
      app: besvc3
  template:
    metadata:
      labels:
        app: besvc3
    spec:
      containers:
      - name: besvc3
        image: besvc3:v3
        imagePullPolicy: Never
        ports:
        - containerPort: 8080
          name: http
        envFrom:
        - configMapRef:
            name: app-config
        env:
        - name: ASPNETCORE_ENVIRONMENT
          value: "Production"
        - name: ASPNETCORE_URLS
          value: "http://+:8080"
        - name: RabbitMQ__Host
          value: "rabbitmq-service"
        - name: RabbitMQ__HostName
          value: "rabbitmq-service"
        - name: RabbitMQ__Port
          value: "5672"
        - name: ConnectionStrings__DefaultConnection
          valueFrom:
            secretKeyRef:
              name: sqlserver-secret
              key: connection-string-besvc3
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 15
          periodSeconds: 5
