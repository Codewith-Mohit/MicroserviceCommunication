apiVersion: apps/v1
kind: Deployment
metadata:
  name: fesvc-deployment
  namespace: microservices-communication
  labels:
    app: fesvc
spec:
  replicas: 2
  selector:
    matchLabels:
      app: fesvc
  template:
    metadata:
      labels:
        app: fesvc
    spec:
      containers:
      - name: fesvc-container
        image: fesvc:v3
        imagePullPolicy: Never
        ports:
        - containerPort: 8080
          name: http
        - containerPort: 443
          name: https
        env:
        - name: ASPNETCORE_ENVIRONMENT
          value: "Production"
        - name: Services__BESvc1
          value: "http://besvc1-service:8080"
        - name: Services__BESvc2
          value: "http://besvc2-service:8080"
        - name: Services__BESvc3
          value: "http://besvc3-service:8080"
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /
            port: 8080
          initialDelaySeconds: 60
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 5
