apiVersion: v1
kind: Service
metadata:
  name: fesvc
  namespace: microservices-communication
  labels:
    app: fesvc
spec:
  type: LoadBalancer
  ports:
  - port: 8080
    targetPort: 8080
    protocol: TCP
    name: http
  - port: 443
    targetPort: 443
    protocol: TCP
    name: https
  selector:
    app: fesvc
