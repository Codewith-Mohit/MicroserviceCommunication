services:
  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
       RABBITMQ_DEFAULT_USER: guest
       RABBITMQ_DEFAULT_PASS: guest

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: sqlserver
    ports:
      - "1433:1433"
    environment:
       SA_PASSWORD: "Your_password123"
       ACCEPT_EULA: "Y"

  ms1:
    build:
      context: .
      dockerfile: Dockerfile/MS1.Dockerfile
    container_name: ms1
    ports:
      - "5001:8080"
    environment:
      ConnectionStrings__DefaultConnection: "Server=sqlserver;User Id=sa;Password=Your_password123;TrustServerCertificate=True;"
      RabbitMQ__Host: "rabbitmq"
    depends_on:
      - rabbitmq
      - sqlserver

  ms2:
    build:
      context: .
      dockerfile: Dockerfile/MS2.Dockerfile
    container_name: ms2
    ports:
      - "5002:8080"
    environment:
      ConnectionStrings__DefaultConnection: "Server=sqlserver;User Id=sa;Password=Your_password123;TrustServerCertificate=True;"
      RabbitMQ__Host: "rabbitmq"
    depends_on:
      - rabbitmq
      - sqlserver

  ms3:
    build:
      context: .
      dockerfile: Dockerfile/MS3.Dockerfile
    container_name: ms3
    ports:
      - "5003:8080"
    environment:
      ConnectionStrings__DefaultConnection: "Server=sqlserver;User Id=sa;Password=Your_password123;TrustServerCertificate=True;"
      RabbitMQ__Host: "rabbitmq"
    depends_on:
      - rabbitmq
      - sqlserver

  ui:
    build:
      context: .
      dockerfile: Dockerfile/UI.Dockerfile
    container_name: ui
    ports:
      - "5000:8080"
    environment:
      Services__MS1: "http://ms1:8080"
      Services__MS2: "http://ms2:8080"
      Services__MS3: "http://ms3:8080"
    depends_on:
      - ms1
      - ms2
      - ms3